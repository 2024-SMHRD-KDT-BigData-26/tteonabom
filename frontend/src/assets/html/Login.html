<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 떠나봄</title>
    <!-- 부트스트랩 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 로컬 CSS -->
    <link rel="stylesheet" href="/CSS/Login.css">
</head>

<body>
    <!-- 로고 -->
    <div class="text-center mb-4">
        <img src="/img/Logo.png" alt="떠나봄 로고" class="img-fluid" style="max-width: 200px;">
    </div>
    <div class="container">
        <form class="form-container">
            <!-- 로그인 제목 -->
            <h3 class="login_text">로그인</h3>

            <!-- 아이디 입력 -->
            <div class="mb-3">
                <input type="text" id="userId" class="form-control" placeholder="아이디를 입력하세요" required>
            </div>

            <!-- 비밀번호 입력 -->
            <div class="mb-3">
                <input type="password" id="password" class="form-control" placeholder="비밀번호를 입력하세요" required>
            </div>

            <!-- 로그인 버튼 -->
            <button type="button" class="login_btn">로그인</button>

            <!-- 구분선 -->
            <div class="separator my-3">또는</div>

            <!-- 카카오 로그인 -->
            <a id="kakao-login-btn" href="#">
                <img src="/img/kakao_logo.png" alt="카카오 로그인 버튼">
            </a>

            <!-- 회원가입 링크 -->
            <div class="text-center mt-3">
                <a href="/html/Join.html" class="register-link">회원가입</a>
            </div>
        </form>



    </div>
    </div>
    <!-- 부트스트랩 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
