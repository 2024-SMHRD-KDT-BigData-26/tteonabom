<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 떠나봄</title>
    <!-- 부트스트랩 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 로컬 CSS -->
    <link rel="stylesheet" href="/CSS/Join.css">
</head>

<body>
    <!-- 로고 -->
    <div class="text-center mb-4">
        <img src="/img/Logo.png" alt="떠나봄 로고" class="img-fluid" style="max-width: 200px;">
    </div>
    <div class="container">
        <form class="form-container" onsubmit="return validateForm()"> <!-- JavaScript 유효성 검사 함수 호출 -->
            <h3 class="join_text">회원가입</h3>
            <!-- 프로필 이미지 -->
            <div class="profile_img">
                <label for="profile-upload" id="profile-label" style="cursor: pointer;">프로필 사진 선택</label>
                <input id="profile-upload" name="profileImg" type="file" accept="image/*" style="display: none;" />
                <img id="profile-preview" src="#" alt="미리보기" style="display:none; width: 100px; height: 100px;" />
                <script src="/JS/Join.js"></script>
            </div>

            <!-- 아이디 -->
            <div class="mb-3 d-flex align-items-center">
                <input type="text" id="userId" class="form-control me-2" placeholder="아이디를 입력하세요 (5~10자의 영문 소문자, 숫자)"
                    required>
                <button class="btn btn-outline-primary" type="button" style="white-space: nowrap;">중복확인</button>

            </div>

            <!-- 비밀번호 -->
            <div class="mb-3">
                <input type="password" id="password" class="form-control"
                    placeholder="비밀번호를 입력하세요 (8~16자의 영문 대/소문자, 숫자)" required
                    pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,16}$" title="비밀번호는 8~16자 사이의 영문(대/소문자)과 숫자를 포함해야 합니다.">

            </div>

            <!-- 비밀번호 확인 -->
            <div class="mb-3">
                <input type="password" id="confirmPassword" class="form-control" placeholder="비밀번호를 다시 입력하세요" required>

            </div>

            <!-- 닉네임 -->
            <div class="mb-4 d-flex align-items-center">
                <input type="text" id="nickname" class="form-control me-2" placeholder="닉네임을 입력하세요 (1~8자의 영문 소문자, 숫자)"
                    required>
                <button class="btn btn-outline-primary" type="button" style="white-space: nowrap;">중복확인</button>

            </div>
            <!-- 경고 메시지 영역 -->
			<div id="message">
                <small id="nick-error" class="error-message"></small>
                <small id="id-error" class="error-message"></small>
                <small id="password-error" class="error-message"></small>
            </div>

            <!-- 버튼 그룹 -->
            <div class="btn-group">
                <button type="button" class="cancel_btn">취소</button>
                <button type="submit" class="join_btn">회원가입</button>
            </div>
        </form>



    </div>
    </div>
    <!-- 부트스트랩 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
