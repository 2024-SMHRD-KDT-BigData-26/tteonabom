[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# ✅ MySQL DB 연결 설정 (conn.py와 동일하게 맞춤)
sqlalchemy.url = mysql+pymysql://cgi_24K_bigdata26_p3_2:smhrd2@project-db-cgi.smhrd.com:3307/cgi_24K_bigdata26_p3_2?charset=utf8mb4

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
